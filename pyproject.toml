[project]
name = "nlbin"
version = "1.0.0"
description = "Normalize/Binarize RGB images using the OCRopus/nlbin algorithm."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "jahtz", email = "dev@janikhtz.de" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "click>=8.3.3",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "rich>=15.0.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
cuda12 = ["cupy-cuda12x"]
cuda12ctk = ["cupy-cuda12x[ctk]"]
cuda13 = ["cupy-cuda13x"]
cuda13ctk = ["cupy-cuda13x[ctk]"]

[project.urls]
Homepage = "https://www.uni-wuerzburg.de/zpd/"
Repository = "https://github.com/jahtz/nlbin"
Documentation = "https://github.com/jahtz/nlbin#readme"
Issues = "https://github.com/jahtz/nlbin/issues"

[project.scripts]
nlbin = "nlbin.cli:cli"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
